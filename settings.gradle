    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven { url = 'https://repository.map.naver.com/archive/maven' }
            }
            filter { includeGroup('com.naver.maps') }
        }
    }
}
rootProject.name = 'MoadealJava'
include ':app'
